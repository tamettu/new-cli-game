[package]
name = "new_cli_game"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
rand = "0.10.2"
rayon = "1.12.0"
rust_decimal = "1.43.0"
rust_decimal_macros = "1.40.0"
serde_json = "1.0.151"
smallvec = "1.16.3"
unicode-width = "0.2.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
# debug = true
